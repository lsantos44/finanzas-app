# Comprobación de cada cambio antes de publicarlo: linter, pruebas, compilación y una
# prueba en navegador real (móvil y escritorio) sobre la app compilada.
name: Comprobaciones
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: test-results/
          retention-days: 7
